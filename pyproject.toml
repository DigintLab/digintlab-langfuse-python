[project]
name = "digintlab-langfuse-python"
version = "0.1.0"
description = "Typed Python helpers for Langfuse tracing, scoring, callbacks, and LiteLLM metadata in DigIntLab agent runtimes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "botocore>=1.43.34",
  "httpx>=0.28.1",
  "langchain>=1.3.10",
  "langchain-core>=1.4.8",
  "langfuse>=4.9.1",
  "opentelemetry-api>=1.42.1",
  "opentelemetry-instrumentation-botocore>=0.63b1",
  "opentelemetry-instrumentation-httpx>=0.63b1",
  "opentelemetry-sdk>=1.42.1",
]

[dependency-groups]
dev = [
  "mypy[faster-cache]>=2.1.0",
  "pytest>=9.1.1",
  "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digintlab_langfuse"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = ["ALL"]
ignore = [
  "D1",
  "D2",
  "D4",
  "ANN",
  "COM812",
  "ISC001",
  "PLC0415",
  "PLR2004",
  "PLR0913",
  "S101",
  "FBT",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "D", "SLF001", "T201"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
implicit_reexport = true
namespace_packages = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

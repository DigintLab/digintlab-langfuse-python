[project]
name = "digintlab-langfuse-python"
version = "0.3.0"
description = "Typed Python helpers for Langfuse tracing, scoring, callbacks, and LiteLLM metadata in DigIntLab agent runtimes."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "DigIntLab" }]
keywords = ["langfuse", "langchain", "litellm", "opentelemetry", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "botocore>=1.43.82,<2",
  "httpx>=0.28.1,<1",
  "langchain-core>=1.6.1,<2",
  "langfuse==5.2.0",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-instrumentation-botocore>=0.65b0,<1",
  "opentelemetry-instrumentation-httpx>=0.65b0,<1",
  "opentelemetry-sdk>=1.44.0,<2",
]

[project.optional-dependencies]
redaction = [
  "presidio-analyzer==2.2.366",
  "presidio-anonymizer==2.2.366",
  "spacy==3.8.18",
  "tldextract>=5.3.2,<6",
]

[project.urls]
Repository = "https://github.com/DigintLab/digintlab-langfuse-python"

[dependency-groups]
audit = ["pip-audit==2.10.1"]
dev = [
  "hatchling==1.32.4",
  "mypy[faster-cache]>=2.3.1",
  "botocore-stubs>=1.43.0",
  "mypy-boto3-bedrock-runtime>=1.43.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.5",
  "twine==7.0.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digintlab_langfuse"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = ["ALL"]
ignore = [
  "CPY001",
  "D1",
  "D2",
  "D4",
  "ANN",
  "COM812",
  "ISC001",
  "PLC0415",
  "PLR2004",
  "PLR0913",
  "S101",
  "FBT",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "D", "SLF001", "T201"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
implicit_reexport = true
namespace_packages = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: authenticated tests against a dedicated external Langfuse project"]

[tool.coverage.run]
branch = true
source = ["digintlab_langfuse"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: monthly
      time: "12:00"
    cooldown:
      default-days: 7
    groups:
      digintlab-langfuse-python:
        dependency-type: "production"
      digintlab-langfuse-python-dev:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
      time: "12:00"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

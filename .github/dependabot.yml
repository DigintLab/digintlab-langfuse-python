version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-version-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security-dependencies:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-version-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security-dependencies:
        applies-to: "security-updates"
        patterns:
          - "*"

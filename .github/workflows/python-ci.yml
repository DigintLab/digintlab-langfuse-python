name: Python Checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - src/**
      - tests/**
      - .github/workflows/python-ci.yml
      - Taskfile.yml
      - pyproject.toml
      - uv.lock

permissions: {}

jobs:
  python-ci:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    env:
      UV_LOCKED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python }}
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ github.token }}
      - name: Install dependencies
        run: task install
      - name: Format, lint, and type checks
        run: task check
      - name: Tests
        run: task test
      - name: Build
        run: uv build

  infra-scan:
    name: Scan with KICS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KICS scan
        uses: Checkmarx/kics-github-action@4a16c2130b02104dc2624c133d5224080e7cc49b # v2.2.1
        with:
          path: .
          output_path: kics_results.sarif
          output_formats: sarif
          fail_on: high,medium
          token: ${{ github.token }}
          enable_comments: true
          enable_annotations: true
          enable_jobs_summary: true
          comments_with_queries: true

  actions-scan:
    name: GitHub Actions security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        continue-on-error: true
        with:
          fail_level: any
          filter_mode: nofilter
          tool_name: actionlint
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Run zizmor
        run: uvx zizmor@1.32.0 --offline --format github .

name: Python Checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - src/**
      - tests/**
      - .github/workflows/python-ci.yml
      - Taskfile.yml
      - pyproject.toml
      - uv.lock

jobs:
  python-ci:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: DigintLab/github/.github/workflows/python-ci.yml@python-ci-v0

  infra-scan:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: DigintLab/github/.github/workflows/infra-security-scan.yml@infra-scan-v0

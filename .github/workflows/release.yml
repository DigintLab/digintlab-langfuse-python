name: Release
on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      UV_LOCKED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ github.token }}
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject version ${version}"
            exit 1
          fi
      - name: Install dependencies
        run: task install
      - name: Format, lint, and type checks
        run: task check
      - name: Tests
        run: task test
      - name: Build
        run: uv build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Extract release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## / { exit }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG}"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --verify-tag --title "${TAG}" --notes-file release-notes.md
